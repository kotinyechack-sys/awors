<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment | BitValve</title>
  <link rel="icon" type="image/webp" href="/myicon.webp">
  <link rel="apple-touch-icon" href="/myicon.webp">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #1f2a2d;
      color: #f3f4f6;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .panel {
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 28px 26px 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.26);
    }

    .logo {
      text-align: center;
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: 0.02em;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h2 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
    }

    .method-box {
      text-align: center;
      font-size: 1.1rem;
      color: #d1fae5;
      font-weight: 600;
      margin: 10px 0 22px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      margin-bottom: 22px;
    }

    .info-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      background: rgba(255,255,255,0.035);
      padding: 12px 14px;
    }

    .info-row strong {
      color: #a7c8c1;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .info-row span {
      color: #f9fafb;
      font-size: 1rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .payment-note {
      margin-top: 18px;
      color: #d1d5db;
      font-size: 0.95rem;
      line-height: 1.6;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 14px 12px;
    }

    .action {
      margin-top: 28px;
    }

    .confirm-btn {
      width: 100%;
      border: 0;
      border-radius: 999px;
      background: #dfe9d5;
      color: #1f2937;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 20px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .confirm-btn:hover {
      background: #edf6dd;
    }

    .status {
      display: none;
      margin-top: 18px;
      text-align: center;
      color: #d1fae5;
      font-size: 1rem;
      font-weight: 600;
    }

    .status.show {
      display: block;
    }

    @media (max-width: 640px) {
      .panel {
        padding: 24px 20px;
      }

    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <div class="logo">BitValve</div>
      <a class="back-link" href="/login">← Back</a>

      <div class="header">
        <h2>Payment Details</h2>
      </div>

      <div class="method-box" id="paymentMethodLabel">Loading payment method…</div>
      <div id="paymentFields" class="info-list"></div>

      <div id="paymentNote" class="payment-note" hidden></div>

      <div class="action">
        <button class="confirm-btn" id="confirmPaymentBtn" type="button">Confirm Payment</button>
        <div id="paymentStatus" class="status">Processing...</div>
      </div>
    </div>
  </div>

  <script>
    const paymentMethodLabel = document.getElementById('paymentMethodLabel');
    const paymentFields = document.getElementById('paymentFields');
    const paymentNote = document.getElementById('paymentNote');
    const confirmPaymentBtn = document.getElementById('confirmPaymentBtn');
    const paymentStatus = document.getElementById('paymentStatus');

    function getSlugFromPath() {
      const match = window.location.pathname.match(/\/p\/([^\/]+)/);
      return match ? match[1] : null;
    }

    async function loadPaymentConfig() {
      const slug = getSlugFromPath();
      const apiUrl = slug ? `/api/payment-link/${slug}` : '/api/payment-settings';
      
      const response = await fetch(apiUrl);
      if (!response.ok) {
        paymentMethodLabel.textContent = 'Payment unavailable';
        return;
      }

      const config = await response.json();
      if (!config || !config.enabled) {
        window.location.href = '/login';
        return;
      }

      paymentMethodLabel.textContent = config.method || 'Payment Method';
      const fields = Array.isArray(config.fields) ? config.fields.filter((field) => field.enabled !== false) : [];
      paymentFields.replaceChildren();

      const isBankTransfer = (config.method || '').toLowerCase() === 'bank transfer';
      const getLegacyValue = (names) => {
        const field = fields.find((item) => {
          const name = String(item.name || '').replace(/\s+/g, '').toLowerCase();
          const label = String(item.label || '').replace(/\s+/g, '').toLowerCase();
          return names.includes(name) || names.includes(label);
        });
        return field ? field.value || '' : '';
      };

      if (isBankTransfer) {
        addPaymentRow('Bank name', config.bankName || getLegacyValue(['bankname']) || '—');
        addPaymentRow('Recipient name', config.recipientName || getLegacyValue(['recipientname', 'accountname']) || '—');
        addPaymentRow('Account number', config.accountNumber || getLegacyValue(['accountnumber']) || '—');
        addPaymentRow('Amount', `${config.amount || '—'} ${config.currency || ''}`.trim());
      } else {
        if (config.recipientName) {
          addPaymentRow('Recipient name', config.recipientName);
        }
        addPaymentRow('Amount', `${config.amount || '—'} ${config.currency || ''}`.trim());
      }

      fields.forEach((field) => {
        const key = String(field.name || field.label || '').replace(/\s+/g, '').toLowerCase();
        if (['bankname', 'recipientname', 'accountname', 'accountnumber', 'amount', 'currency'].includes(key)) {
          return;
        }
        addPaymentRow(field.label || field.name || 'Field', field.value || '—');
      });

      if (!paymentFields.childElementCount) {
        addPaymentRow('Payment', 'No details configured.');
      }

      paymentNote.textContent = config.note || '';
      paymentNote.hidden = !config.note;
    }

    function addPaymentRow(label, value) {
      const row = document.createElement('div');
      const heading = document.createElement('strong');
      const content = document.createElement('span');
      row.className = 'info-row';
      heading.textContent = label;
      content.textContent = value;
      row.append(heading, content);
      paymentFields.appendChild(row);
    }

    confirmPaymentBtn.addEventListener('click', () => {
      confirmPaymentBtn.disabled = true;
      confirmPaymentBtn.textContent = 'Processing...';
      paymentStatus.classList.add('show');

      setTimeout(() => {
        window.location.href = '/login';
      }, 1200);
    });

    loadPaymentConfig();
  </script>
</body>
</html>
