<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | BitValve</title>
  <link rel="icon" type="image/webp" href="/myicon.webp">
  <link rel="apple-touch-icon" href="/myicon.webp">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6f5;
      color: #1f2937;
    }

    .wrap {
      max-width: 720px;
      margin: 80px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(15, 118, 110, 0.08);
    }

    h1 {
      color: #0f766e;
      margin-top: 0;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      background: #0f766e;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Welcome to your dashboard</h1>
    <p>You are logged in and connected to the SQLite backend.</p>
    <div class="actions">
      <button type="button" id="adminBtn">Go to Admin</button>
      <button type="button" class="secondary" id="logoutBtn">Logout</button>
    </div>
  </div>

  <script>
    document.getElementById('adminBtn').addEventListener('click', async () => {
      const response = await fetch('/api/session');
      const data = await response.json();

      if (data.user && data.user.role === 'admin') {
        window.location.href = '/admin';
        return;
      }

      alert('Admin access only.');
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });
  </script>
</body>
</html>
